name: Release

# Release: Actions → Release → Run workflow (on main), enter a version.
# Bumps package-info.json, builds, verifies, pushes the bump to main with the
# release deploy key, tags and publishes.
# Pushing a v* tag yourself also releases. Pull requests run build + verify only.
#
# If main is protected: a write deploy key whose private half is the
# RELEASE_DEPLOY_KEY secret of the "release" environment (see RELEASING.md).
# Without that secret the bump is pushed with the normal workflow token.
#
# Nothing is signed here; ll_externals releases are already signed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0"
        required: true
        type: string
      dry_run:
        description: "Build and verify only (no commit, tag or release)"
        required: false
        type: boolean
        default: false
      ll_externals_tag:
        description: "ll_externals release tag to bundle (empty = the one matching the submodule)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "externals/**"
      - "package-info.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            VERSION=$(jq -r .version package-info.json)
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version (expected e.g. 1.2.0 or 1.2.0-beta.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check this release can be made
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run the release from $DEFAULT_BRANCH (or tick dry run)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Bump version in package-info.json
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/bump_version.sh "${{ steps.version.outputs.version }}"

      - name: Check package-info.json matches the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ACTUAL=$(jq -r .version package-info.json)
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::package-info.json says $ACTUAL but releasing $VERSION. Run bump_version.sh before tagging."
            exit 1
          fi

      - name: Build package
        env:
          LL_EXTERNALS_TAG: ${{ inputs.ll_externals_tag }}
        run: bash scripts/build_package.sh

      - name: Verify externals are signed
        run: bash scripts/verify_externals.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            ppooll.maxpack
            ppooll.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Pushed with the deploy key if RELEASE_DEPLOY_KEY is set (it bypasses
      # main's rulesets), otherwise with the workflow token.
      # Fails if main moved since the build, so the release always matches
      # what was built.
      - name: Commit and push version bump
        if: github.event_name == 'workflow_dispatch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/bump_version.sh "$VERSION"
          if git diff --quiet -- package-info.json; then
            echo "package-info.json already at $VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release v$VERSION" -- package-info.json
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Previous release: before the tagged commit (tag push) or at/before HEAD.
          REF=HEAD; [ "$GITHUB_EVENT_NAME" = "push" ] && REF=HEAD^
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$REF" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGES="https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
          else
            CHANGES="https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          fi
          cat > release-notes.md <<EOF
          Install: drag \`ppooll.maxpack\` onto the Max console.

          Changes: $CHANGES
          EOF
          # Creates the tag on the release commit (tags made with GITHUB_TOKEN
          # don't trigger this workflow again).
          gh release create "$TAG" ppooll.maxpack ppooll.zip \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file release-notes.md